          </div>
          <div class="card" style="margin-top:12px;">
            <div class="muted" style="font-size:11px;font-weight:700;">Total Transactions</div>
            <div class="strong" style="font-size:26px;color:var(--navy);margin-top:2px;">${filtered.length}</div>
          </div>
          <div id="txnList" style="margin-top:14px;">${buildTxnGroupsHTML(groups)}</div>
          <button class="secondary" style="margin-top:6px;" onclick="showToast('Export coming soon')">⬇ View All Transactions</button>
        </div>
      `);
    }
    function buildTxnGroupsHTML(groups) {
      if (!groups.length) return `<div class="empty-state"><div class="e">🧾</div>No transactions yet.</div>`;
      return groups.map(g => `
        <div class="muted" style="font-size:11px;font-weight:700;margin:12px 0 8px;">${g.date}</div>
        ${g.rows.map(r => `
          <div class="record-row">
            <span class="avatar" style="width:38px;height:38px;font-size:14px;color:#fff;background:${avatarColor(r.person)};">${r.person.charAt(0).toUpperCase()}</span>
            <div class="record-mid">
              <div class="t">${r.person}</div>
              <div class="m"><span style="color:${r.mode === 'UPI' ? 'var(--blue)' : 'var(--success)'};font-weight:700;">${r.mode}</span></div>
            </div>
            <div class="record-side">
              <div class="amt" style="color:${r.direction === 'given' ? 'var(--blue)' : 'var(--pink-2)'};">${r.direction === 'given' ? '↑' : '↓'} ${money(r.amount)}</div>
            </div>
          </div>
        `).join('')}
      `).join('');
    }
    function setTxnFilter(f) {
      state.txnFilter = f;
      render();
    }

    function remindersScreen() {
      state.rmDraft = state.rmDraft || { title: '', date: '', note: '' };
      return wrapWithNav(`
        <div class="page">
          <button class="back-link" onclick="nav('profile')">←</button>
          <h1 style="font-size:24px;color:var(--navy);">Reminders</h1>
          <p class="sub">Never forget to reciprocate a gift.</p>
          <div class="form-stack card" style="margin-top:16px;">
            <div class="field"><label>Title</label><input id="rmTitle" value="${state.rmDraft.title}" placeholder="e.g. Return ₹500 to Arun" oninput="state.rmDraft.title=this.value;"></div>
            <div class="grid-2">
              <div class="field"><label>Date</label><input id="rmDate" type="date" value="${state.rmDraft.date}" oninput="state.rmDraft.date=this.value;"></div>
              <div class="field"><label>Note (optional)</label><input id="rmNote" value="${state.rmDraft.note}" placeholder="Context" oninput="state.rmDraft.note=this.value;"></div>
            </div>
            <button class="secondary" onclick="addReminder()">＋ Add Reminder</button>
          </div>
          <div style="margin-top:14px;display:grid;gap:10px;">
            ${state.reminders.map(r => `
              <div class="record-row">
                <span class="record-icon" style="background:#fff3d6;">⏰</span>
                <div class="record-mid">
                  <div class="t" style="${r.status === 'Completed' ? 'text-decoration:line-through;opacity:0.6;' : ''}">${r.title}</div>
                  <div class="m"><span>📅 ${r.date || 'No date'}</span>${r.note ? `<span>${r.note}</span>` : ''}</div>
                </div>
                <button class="secondary" style="width:auto;padding:8px 12px;" onclick="toggleReminder(${r.id})">${r.status === 'Active' ? '✓ Done' : '↺ Reopen'}</button>
              </div>
            `).join('') || `<div class="empty-state"><div class="e">⏰</div>No reminders yet.</div>`}
          </div>
        </div>
      `);
    }
    function addReminder() {
      const { title, date, note } = state.rmDraft;
      if (!title) { showToast('Enter a reminder title'); return; }
      state.reminders.unshift({ id: state.nextReminderId++, title, date, note, status: 'Active' });
      persist();
      state.rmDraft = { title: '', date: '', note: '' };
      showToast('Reminder added');
      render();
    }
    function toggleReminder(id) {
      const r = state.reminders.find(x => x.id === id);
      r.status = r.status === 'Active' ? 'Completed' : 'Active';
      persist();
      render();
    }

    const relationshipTypes = ['Spouse', 'Son', 'Daughter', 'Father', 'Mother', 'Brother', 'Sister', 'Other'];
    function familyScreen() {
      state.familyAddStage = state.familyAddStage || 'form';
      const verified = state.familyAddStage === 'verified';
      return subPage('Family Account', 'Add family member to your account', `
        <div class="card">
          <div class="form-stack">
            <div class="field"><label>Full Name</label><div class="field-icon">👤<input id="fmName" placeholder="Enter full name" value="${state.familyDraft.name}" oninput="state.familyDraft.name=this.value;"></div></div>
            <div class="field"><label>Mobile Number</label><div class="field-icon">📱<strong style="color:var(--blue);">+91</strong><input id="fmMobile" placeholder="98765 43210" value="${state.familyDraft.mobile}" oninput="state.familyDraft.mobile=this.value;"></div></div>
          </div>
          <div class="menu-item" style="border-bottom:0;">
            <div class="mi-left"><span class="emoji-badge" style="width:36px;height:36px;font-size:16px;background:#e3f7ee;">🛡️</span><div><div class="mi-title" style="font-size:13px;">Verify your mobile number</div><div class="mi-desc">We'll send you an OTP to verify</div></div></div>
            ${verified ? `<span class="verified-badge">✓ Verified</span>` : `<button class="secondary" style="width:auto;padding:9px 16px;" onclick="sendFamilyOtp()">Send OTP</button>`}
          </div>
          ${state.familyAddStage !== 'form' ? `
            <div style="margin-top:6px;">
              <div class="row"><span class="strong" style="font-size:12px;">Enter OTP</span>${!verified ? `<span class="link-text">Resend OTP in 45s</span>` : ''}</div>
              <div class="otp-boxes" style="grid-template-columns:repeat(6,1fr);" id="fmOtpBoxes">
                ${[0, 1, 2, 3, 4, 5].map(() => `<input maxlength="1" oninput="onFamilyOtpDigit()">`).join('')}
              </div>
              ${verified ? `<div style="color:var(--success);font-weight:800;font-size:12.5px;">✓ Mobile number verified</div>` : ''}
            </div>
          ` : ''}
          <div class="field" style="margin-top:14px;margin-bottom:0;">
            <label>Relationship Type</label>
            <select id="fmRelation"><option value="">Select relationship</option>${relationshipTypes.map(r => `<option>${r}</option>`).join('')}</select>
          </div>
        </div>
        <div class="note-strip" style="margin-top:14px;">ℹ️ <div><b>Why we need this?</b><br>This helps you manage and organize your family members better within the app.</div></div>
        <button class="primary" style="margin-top:14px;background:linear-gradient(135deg,#6a5cf7 0%,#e84f9c 100%);" onclick="addFamilyMember()">Add Family Member →</button>
        <p class="sub" style="text-align:center;margin-top:10px;">🔒 Your information is secure and private</p>

        <div class="group-label">Family Members</div>
        <div style="display:grid;gap:10px;">
          ${state.family.map(m => `
            <div class="record-row">
              <span class="record-icon" style="background:#dbe6ff;">👤</span>
              <div class="record-mid">
                <div class="t">${m.name}</div>
                <div class="m"><span>${m.relation}</span><span>${m.mobile}</span></div>
              </div>
              <button class="role-chip ${m.role}" onclick="cycleFamilyRole(${m.id})">${m.role}</button>
            </div>
          `).join('') || `<div class="empty-state"><div class="e">👨‍👩‍👧</div>No family members yet.</div>`}
        </div>
      `);
    }
    function sendFamilyOtp() {
      const mobile = state.familyDraft.mobile;
      if (!mobile) { showToast('Enter a mobile number first'); return; }
      state.familyAddStage = 'sent';
      render();
      showToast('OTP sent to +91 ' + mobile);
    }
    function onFamilyOtpDigit() {
      const boxes = document.querySelectorAll('#fmOtpBoxes input');
      const filled = [...boxes].every(b => b.value.length === 1);
      if (filled) {
        state.familyAddStage = 'verified';
        render();
        showToast('Mobile number verified');
      }
    }
    function addFamilyMember() {
      const name = state.familyDraft.name;
      if (!name) { showToast('Enter a name'); return; }
      if (state.familyAddStage !== 'verified') { showToast('Please verify the mobile number first'); return; }
      const mobile = '+91 ' + (state.familyDraft.mobile || '—');
      const relation = document.getElementById('fmRelation').value || 'Family';
      state.family.push({ id: state.nextFamilyId++, name, relation, mobile, role: 'Guest', status: 'Active' });
      persist();
      state.familyAddStage = 'form';
      state.familyDraft = { name: '', mobile: '' };
      showToast('Family member added!');
      render();
    }
    function cycleFamilyRole(id) {
      const order = ['Admin', 'Member', 'Guest'];
      const m = state.family.find(x => x.id === id);
      m.role = order[(order.indexOf(m.role) + 1) % order.length];
      persist();
      render();
    }

    function settingsScreen() {
      return subPage('Settings', 'Manage your app settings and privacy.', `
        <div class="group-label" style="margin-top:0;">Privacy &amp; Security</div>
        <div class="card">
          <div class="menu-item">
            <div class="mi-left">
              <span class="emoji-badge" style="width:36px;height:36px;font-size:16px;background:#ffe3ee;">🙈</span>
              <div><div class="mi-title">Hide Amount for Each Record</div><div class="mi-desc">Hide amounts in all records and lists</div></div>
            </div>
            <button class="toggle-pill ${state.settings.hideAmounts ? 'on' : ''}" onclick="toggleSetting('hideAmounts')"></button>
          </div>
        </div>
        <div class="note-strip" style="margin-top:14px;">🛡️ Your data is 100% private and secure. You are in control of your privacy.</div>
        <div class="card" style="margin-top:24px;border-color:#ffd7e2;background:#fff5f8;">
          <div class="menu-item" onclick="logout()" style="color:var(--pink-2);border-bottom:0;">↪ Logout <span class="muted" style="font-size:11px;">Sign out from this device</span></div>
        </div>
      `);
    }
    function toggleSetting(key) {
      state.settings[key] = !state.settings[key];
      persist();
      showToast('Settings updated');
      render();
    }

    const autoLockOptions = ['Immediately', '1 Minute', '5 Minutes', '15 Minutes', 'Never'];
    function cycleAutoLock() {
      const i = autoLockOptions.indexOf(state.settings.autoLock || '5 Minutes');
      state.settings.autoLock = autoLockOptions[(i + 1) % autoLockOptions.length];
      persist();
      render();
    }
    function securityScreen() {
      return subPage('Security', 'Manage your app security and privacy.', `
        <div class="card" style="background:linear-gradient(135deg,#eef2ff 0%,#f5eeff 100%);">
          <div class="row">
            <div><div class="strong" style="font-size:15px;color:var(--navy);">Your account is secure</div><p class="sub" style="margin-top:4px;max-width:220px;">We use advanced security to keep your data safe and private.</p></div>
            <span style="font-size:34px;">🛡️</span>
          </div>
        </div>
        <div class="group-label">Account Security</div>
        <div class="card">
          ${menuRow('🔒', 'Change Password', 'Update your account password', 'change-password')}
          <div class="menu-item" onclick="cycleAutoLock()">
            <div class="mi-left"><span class="emoji-badge" style="width:36px;height:36px;font-size:16px;background:#e3f7ee;">⏱️</span><div><div class="mi-title">Auto Lock</div><div class="mi-desc">Automatically lock the app</div></div></div>
            <span class="strong" style="color:var(--blue);font-size:12px;">${state.settings.autoLock || '5 Minutes'} ›</span>
          </div>
        </div>
        <div class="group-label">Device &amp; Session</div>
        <div class="card">
          ${menuRow('📵', 'Logout from All Devices', 'Sign out from all devices except this one', 'logout-devices')}
        </div>
        <div class="note-strip" style="margin-top:14px;">🛡️ Keep your account secure — we recommend using a strong password and keeping your app up to date.</div>
      `);
    }

    function logoutDevicesScreen() {
      const sessions = [
        { device: 'Windows • Chrome', loc: 'Bangalore, India', when: '2 hours ago' },
        { device: 'Android • Samsung S23', loc: 'Mumbai, India', when: 'Yesterday, 08:45 PM' },
        { device: 'iPad • Safari', loc: 'Hyderabad, India', when: '3 days ago' }
      ];
      return subPage('Logout from All Devices', 'This will sign you out from all devices except this one. You will need to login again on those devices.', `
        <div class="note-strip" style="background:#fff3de;border-color:#ffe1a8;">⚠️ <div><b>Important</b><br>After logging out, all other devices will lose access to your account and you will need to login again.</div></div>
        <div class="card" style="margin-top:14px;">
          <div class="strong" style="font-size:13px;">📱 Active Session</div>
          <p class="sub" style="margin-top:2px;">You are currently logged in on this device</p>
          <div class="record-row" style="margin-top:10px;background:#eef2ff;border:0;">
            <span class="record-icon" style="background:#dbe6ff;">📱</span>
            <div class="record-mid"><div class="t">iPhone 15 Pro (This Device)</div><div class="m"><span>Chennai, India</span><span style="color:var(--success);">Currently Active</span></div></div>
          </div>
        </div>
        <div class="card" style="margin-top:14px;">
          <div class="strong" style="font-size:13px;">💻 Other Active Sessions (${sessions.length})</div>
          ${sessions.map(s => `
            <div class="record-row" style="margin-top:10px;">
              <span class="record-icon" style="background:#eef1fb;">💻</span>
              <div class="record-mid"><div class="t">${s.device}</div><div class="m"><span>${s.loc}</span><span>${s.when}</span></div></div>
              <span class="status-chip" style="background:var(--pending-bg);color:var(--pending);">Will be logged out</span>
            </div>
          `).join('')}
        </div>
        <div class="note-strip" style="margin-top:14px;background:#fff0f3;border-color:#ffd7e2;">
          🚪 <div><b>Logout from All Devices</b><br>Are you sure you want to logout from all other devices? This action cannot be undone.</div>
        </div>
        <button class="primary" style="margin-top:14px;background:linear-gradient(135deg,#ff5c5c 0%,#e0364a 100%);" onclick="confirmLogoutAllDevices()">↪ Logout from All Devices</button>
      `);
    }
    function confirmLogoutAllDevices() {
      showToast('Logged out from all other devices');
      nav('security');
    }

    function helpScreen() {
      return subPage('Help & Support', "We're here to help you anytime.", `
        <div class="card" style="background:linear-gradient(135deg,#eef2ff 0%,#f5eeff 100%);">
          <div class="strong" style="font-size:16px;color:var(--navy);">Need help?</div>
          <p class="sub" style="margin-top:4px;">Find answers, get support and connect with our team.</p>
          <button class="primary" style="margin-top:12px;width:auto;padding:12px 20px;" onclick="showToast('Support chat coming soon')">💬 Start a Conversation</button>
        </div>
        <div class="group-label">Quick Help</div>
        <div class="card">${menuRow('📖', 'FAQs', 'Find quick answers to common questions', 'faqs')}</div>
        <div class="group-label">Contact Support</div>
        <div class="card">${menuRow('✉️', 'Email Support', 'support@relfam.com', 'mailto:support@relfam.com')}</div>
        <div class="note-strip" style="margin-top:14px;">🎧 <div><b>We're here to help</b><br>Our support team usually responds within 24 hours on business days.<br>Support Hours: Mon–Fri, 9:00 AM – 6:00 PM (IST)</div></div>
      `);
    }

    const faqs = [
      ['What do "Old" and "New" mean when adding a record?', `
        <div class="menu-item"><div class="mi-left"><span class="emoji-badge" style="background:#e3f7ee;">🎁</span><div><b style="color:var(--success);">New</b><div class="mi-desc" style="white-space:normal;">Select New when you are giving a gift to a person or family for the first time. This creates a new gift relationship in your ledger.</div></div></div></div>
        <div class="menu-item"><div class="mi-left"><span class="emoji-badge" style="background:#ffe3ee;">👥</span><div><b style="color:var(--pink-2);">Old</b><div class="mi-desc" style="white-space:normal;">Select Old when you have already exchanged gifts with the same person or family before. This helps you continue tracking an existing gift history.</div></div></div></div>
        <div class="mi-desc" style="white-space:normal;margin-top:6px;"><b>Example:</b> You attend Ravi's wedding for the first time and give ₹5,000 → New. Next year you attend Ravi's housewarming and give another ₹3,000 → Old.</div>
      `],
      ['How do I create a new Collection?', 'From Home, tap "Send Gift" → "Create New Collection", give it a name and category (Family, Friend, Corporate or Religious), then start adding entries.'],
      ['How do I add a gift record?', 'Open an Event or Collection and tap "Add Entry". Fill in the sender/receiver details, choose Old and/or New, enter the amount, and save.'],
      ['What is the difference between Contributed and Received?', "Contributed (given) is money you sent to someone else's event. Received is money guests gave you at an event you're hosting."],
      ['How do I edit or delete a record?', 'Open the record from View Records and use Edit. You can update the name, place and status — amount and date stay fixed to protect the ledger history.'],
      ['How do I set a reminder?', 'Go to Profile → Reminders → Add Reminder, give it a title and a date, and it will show up until you mark it done.'],
      ['How do I change my password?', 'Go to Profile → Security → Change Password, enter your current password, then choose a new one meeting the strength requirements.']
    ];
    function faqsScreen() {
      return subPage('FAQs', 'Find quick answers to common questions.', `
        <input id="faqSearch" placeholder="Search for a question..." oninput="filterFaqs(this.value)" style="margin-bottom:14px;">
        <div class="card" id="faqList">
          ${faqs.map((f, i) => `
            <div class="faq-item ${i === 0 ? 'open' : ''}" id="faq${i}" data-q="${f[0].toLowerCase()}">
              <div class="q" onclick="toggleFaq(${i})"><span>${f[0]}</span><span>⌄</span></div>
              <div class="a">${f[1]}</div>
            </div>
          `).join('')}
        </div>
        <div class="note-strip" style="margin-top:14px;">🎧 <div><b>Can't find what you're looking for?</b><br>Our support team is here to help you.</div> <a href="mailto:support@relfam.com" class="link-text">Email Support</a></div>
      `);
    }
    function toggleFaq(i) {
      document.getElementById('faq' + i).classList.toggle('open');
    }
    function filterFaqs(q) {
      const query = q.trim().toLowerCase();
      document.querySelectorAll('#faqList .faq-item').forEach(el => {
        el.style.display = el.dataset.q.includes(query) ? 'block' : 'none';
      });
    }

    function feedbackScreen() {
      state.feedbackRating = state.feedbackRating || 5;
      return subPage('Feedback', "Tell us what's working and what is not.", `
        <div class="card">
          <label class="strong" style="font-size:12px;color:var(--muted);">Rating</label>
          <div class="star-row" id="starRow" style="margin-top:8px;">
            ${[1, 2, 3, 4, 5].map(n => `<span class="${n <= state.feedbackRating ? 'on' : ''}" onclick="setRating(${n})">★</span>`).join('')}
          </div>
        </div>
        <div class="field" style="margin-top:14px;"><label>Your Feedback</label><textarea id="fbText" placeholder="What can we improve?"></textarea></div>
        <button class="primary" onclick="submitFeedback()">Submit Feedback</button>
      `);
    }
    function setRating(n) {
      state.feedbackRating = n;
      document.querySelectorAll('#starRow span').forEach((el, i) => el.classList.toggle('on', i < n));
    }
    function submitFeedback() {
      showToast('Thanks for your feedback!');
      state.feedbackRating = 5;
      nav('profile');
    }

    function aboutScreen() {
      return subPage('About Relfam', '', `
        <div class="card" style="text-align:center;">
          <div style="font-size:38px;">🎁</div>
          <h2 style="margin-top:8px;color:var(--navy);">Relfam</h2>
          <p class="sub" style="margin-top:6px;">Version 0.1.0 (MVP prototype)</p>
          <p class="sub" style="margin-top:10px;">A digital ledger for the gifts and moi exchanged at family events — so you never lose track of who gave what.</p>
        </div>
      `);
    }

    function shareScreen() {
      return subPage('Share Relfam', 'Invite friends and family to start their own ledger.', `
        <div class="card" style="text-align:center;">
          <div style="font-size:38px;">🔗</div>
          <p class="sub" style="margin-top:10px;">"Track every gift and moi at your family events with Relfam — never lose count of who gave what."</p>
          <button class="primary" style="margin-top:14px;" onclick="shareApp()">Share Now</button>
        </div>
      `);
    }
    function shareApp() {
      const text = "Track every gift and moi at your family events with Relfam — never lose count of who gave what.";
      if (navigator.share) {
        navigator.share({ title: 'Relfam', text }).catch(() => {});
      } else {
        window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank');
      }
    }

    /* ---------- Router ---------- */
    function render() {
      if (!state.user) {
        const preAuthPages = { otp: otpScreen, signup: signupScreen, terms: termsScreen };
        app.innerHTML = (preAuthPages[state.page] || authScreen)();
        return;
      }
      const pages = {
        home: homeScreen,
        notifications: notificationsScreen,
        'find-event': findEventScreen,
        'event-overview': eventOverviewScreen,
        'event-location': eventLocationScreen,
        contribute: contributeScreen,
        'live-streaming': liveStreamingScreen,
        'share-event': shareEventScreen,
        events: eventsScreen,
        'event-detail': eventDetailScreen,
        'create-open': createOpenScreen,
        'create-event-type': createEventTypeScreen,
        'create-event-form': createEventFormScreen,
        'event-created-success': eventCreatedSuccessScreen,
        'view-invitation': viewInvitationScreen,
        'collections-hub': collectionsHubScreen,
        'create-collection': createCollectionScreen,
        'collections-list': collectionsListScreen,
        'collection-detail': collectionDetailScreen,
        'entry-form': entryFormScreen,
        records: recordsScreen,
        'filter-records': filterRecordsScreen,
        'edit-record': editRecordScreen,
        profile: profileScreen,
        'edit-profile': editProfileScreen,
        'change-password': changePasswordScreen,
        'change-mobile': changeMobileScreen,
        'update-dob': updateDobScreen,
        'records-summary': recordsSummaryScreen,
        'transaction-history': transactionHistoryScreen,
        reminders: remindersScreen,
        family: familyScreen,
        settings: settingsScreen,
        security: securityScreen,
        help: helpScreen,
        faqs: faqsScreen,
        'logout-devices': logoutDevicesScreen,
        feedback: feedbackScreen,
        about: aboutScreen,
        share: shareScreen
      };
      const renderFn = pages[state.page] || homeScreen;
      app.innerHTML = renderFn();
      if (state.page === 'create-event-form') initSlideConfirm();
      if (state.page === 'contribute') {
        const ev = getActiveEvent();
        drawEventQr('contributeQrCanvas', ev, typeof state.contributeAmount === 'number' ? state.contributeAmount : null);
      }
      if (state.page === 'entry-form') {
        const isEvent = state.entryContext.kind === 'event';
        const ctx = isEvent ? state.events.find(e => e.id === state.entryContext.id) : state.collections.find(c => c.id === state.entryContext.id);
        const upi = isEvent ? ctx.upi : (state.enDraft.receiverUpi || 'not-set@upi');
        drawEventQr('entryQrCanvas', isEvent ? ctx : { upi, host: getUserName() }, null);
      }
    }

    render();
  </script>
</body>
</html>
