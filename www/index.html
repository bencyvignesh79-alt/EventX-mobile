<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#16215c">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  <title>Relfam</title>
  <style>
    :root {
      --bg-a: #eaf1ff;
      --bg-b: #fdf2f6;
      --panel: #ffffff;
      --navy: #16215c;
      --navy-2: #24327a;
      --blue: #2f6bef;
      --blue-2: #4f8ef7;
      --gold: #eab308;
      --gold-2: #f2a63d;
      --pink: #ff5c8a;
      --pink-2: #ff3d78;
      --text: #1c1f3a;
      --muted: #6b7093;
      --line: #eaecf7;
      --mint: #2ab77c;
      --shadow: 0 10px 26px rgba(30, 40, 100, 0.08);
      --shadow-lg: 0 18px 40px rgba(30, 40, 100, 0.14);
      --success-bg: #e8f8f0;
      --success: #1f9d63;
      --pending-bg: #fff2df;
      --pending: #d98a1a;
      --old-bg: #f1eefc;
      --old: #7457d1;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background: linear-gradient(180deg, var(--bg-a) 0%, var(--bg-b) 100%);
      font-family: 'Poppins', 'Segoe UI', sans-serif;
      color: var(--text);
    }
    h1, h2, h3 { font-family: 'Poppins', sans-serif; margin: 0; }
    .display { font-family: 'Playfair Display', Georgia, serif; }
    button, input, textarea, select { font: inherit; }
    button { border: 0; cursor: pointer; background: none; }
    input, textarea, select {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--text);
      border-radius: 14px;
      width: 100%;
      padding: 13px 14px;
      outline: none;
    }
    textarea { min-height: 84px; resize: vertical; }
    a { color: inherit; }

    .phone {
      width: min(430px, 100vw);
      min-height: 100vh;
      margin: 0 auto;
      background: #f7f8fd;
      position: relative;
      overflow: hidden;
      box-shadow: 0 0 0 1px rgba(29, 25, 63, 0.04);
    }
    .screen { min-height: 100vh; padding-bottom: 96px; }
    .page { padding: 18px; }

    /* ---------- Shared bits ---------- */
    .row { display: flex; align-items: center; justify-content: space-between; }
    .icon-btn {
      width: 42px; height: 42px; display: grid; place-items: center;
      border-radius: 14px; background: #fff; box-shadow: var(--shadow);
      font-size: 18px; color: var(--navy); flex-shrink: 0;
    }
    .header {
      display: flex; align-items: center; justify-content: space-between; padding: 18px 18px 4px;
    }
    .header-title { text-align: center; flex: 1; }
    .header-title h1 { font-size: 20px; font-weight: 800; color: var(--navy); }
    .header-title p { margin: 2px 0 0; font-size: 11px; color: var(--muted); }
    .sub { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.5; }
    .muted { color: var(--muted); }
    .strong { font-weight: 700; }
    .card {
      background: var(--panel); border: 1px solid var(--line); border-radius: 20px;
      box-shadow: 0 6px 18px rgba(30, 40, 100, 0.05); padding: 16px;
    }
    .primary, .secondary, .ghost {
      width: 100%; border-radius: 16px; padding: 15px 16px; font-weight: 800; font-size: 14px;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .primary {
      background: linear-gradient(135deg, var(--blue-2) 0%, var(--blue) 100%);
      color: #fff; box-shadow: 0 14px 26px rgba(47, 107, 239, 0.28);
    }
    .secondary {
      background: #fff; color: var(--blue); border: 1px solid #dbe6ff;
    }
    .ghost { background: transparent; color: var(--pink-2); border: 1px solid #ffd7e2; }
    .pink-btn {
      background: linear-gradient(135deg, var(--pink-2) 0%, var(--pink) 100%);
      color: #fff; box-shadow: 0 14px 26px rgba(255, 61, 120, 0.28);
    }
    .gold-btn {
      background: linear-gradient(135deg, var(--gold-2) 0%, var(--gold) 100%);
      color: #fff; box-shadow: 0 14px 26px rgba(234, 179, 8, 0.28);
    }
    .field { display: block; margin-bottom: 12px; }
    .field label {
      display: block; font-size: 11px; letter-spacing: 0.04em;
      color: var(--muted); font-weight: 700; margin-bottom: 6px;
    }
    .field-icon { display: flex; align-items: center; gap: 10px; background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
    .field-icon input, .field-icon select { border: 0; padding: 0; }
    .form-stack { display: grid; gap: 14px; }
    .back-link {
      color: var(--blue); font-weight: 800; padding: 0; margin-bottom: 4px;
      font-size: 20px; display: inline-flex;
    }
    .toast {
      position: fixed; bottom: 96px; left: 50%; transform: translateX(-50%);
      width: min(380px, calc(100vw - 36px)); background: #1c1f3a; color: #fff; padding: 12px 16px;
      border-radius: 12px; font-size: 12.5px; font-weight: 700; box-shadow: 0 18px 30px rgba(29, 23, 59, 0.25);
      z-index: 30; text-align: center;
    }

    /* ---------- Bottom nav ---------- */
    .bottom-nav {
      position: fixed; bottom: 0; width: min(430px, 100vw); display: grid; grid-template-columns: repeat(5, 1fr);
      background: rgba(255,255,255,0.97); backdrop-filter: blur(10px); border-top: 1px solid var(--line);
      padding: 10px 8px calc(8px + env(safe-area-inset-bottom)); z-index: 9; align-items: end;
    }
    .nav-btn {
      color: var(--muted); font-size: 10px; font-weight: 800; padding: 4px 2px 0;
      display: grid; place-items: center; gap: 4px;
    }
    .nav-btn.active { color: var(--blue); }
    .nav-btn b { font-size: 19px; }
    .nav-fab {
      width: 50px; height: 50px; border-radius: 50%; margin: -26px auto 0;
      background: linear-gradient(135deg, var(--gold-2) 0%, var(--gold) 100%);
      color: #fff; font-size: 24px; display: grid; place-items: center;
      box-shadow: 0 14px 24px rgba(234, 179, 8, 0.4);
    }
    .fab {
      position: absolute; right: 18px; bottom: 96px; width: 52px; height: 52px; border-radius: 50%;
      background: linear-gradient(135deg, var(--blue-2) 0%, var(--blue) 100%); color: #fff;
      font-size: 24px; display: grid; place-items: center; box-shadow: 0 14px 26px rgba(47,107,239,0.35); z-index: 8;
    }

    /* ---------- Auth ---------- */
    .login-screen {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(180deg, #eaf1ff 0%, #fdf1f5 100%); padding: 30px 22px;
    }
    .auth-emblem { text-align: center; font-size: 46px; margin-bottom: 6px; }
    .auth-heading { text-align: center; font-size: 27px; font-weight: 800; color: var(--navy); margin: 4px 0 4px; }
    .auth-sub { text-align: center; color: var(--muted); font-size: 13px; margin-bottom: 20px; }
    .auth-card {
      width: 100%; background: rgba(255,255,255,0.85); border: 1px solid rgba(255,255,255,0.8);
      border-radius: 26px; padding: 20px 18px; box-shadow: 0 22px 40px rgba(90, 64, 157, 0.1);
    }
    .auth-tabs { display: grid; grid-template-columns: 1fr 1fr; background: #eef1fb; border-radius: 14px; padding: 4px; margin-bottom: 18px; }
    .auth-tab { border-radius: 11px; font-weight: 800; font-size: 12px; color: var(--muted); padding: 11px 10px; }
    .auth-tab.active { background: #fff; color: var(--blue); box-shadow: 0 6px 12px rgba(47,107,239,0.14); }
    .divider { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 11px; font-weight: 700; margin: 14px 0; }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--line); }
    .note-strip {
      display: flex; align-items: center; gap: 10px; background: #fff; border: 1px solid var(--line);
      border-radius: 16px; padding: 12px 14px; font-size: 12px; color: var(--muted); font-weight: 600; margin-top: 16px;
    }
    .signup-strip {
      display: flex; align-items: center; justify-content: center; gap: 6px; background: #fff; border: 1px solid var(--line);
      border-radius: 16px; padding: 14px; margin-top: 12px; font-size: 13px; font-weight: 600;
    }
    .signup-strip a, .link-accent { color: var(--pink-2); font-weight: 800; }
    .otp-boxes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 16px 0; }
    .otp-boxes input {
      text-align: center; font-size: 20px; font-weight: 800; padding: 14px 0; border-radius: 14px;
    }

    /* ---------- Home ---------- */
    .greeting-card {
      margin: 4px 18px 18px; padding: 20px 18px; border-radius: 26px; box-shadow: var(--shadow);
      background: linear-gradient(135deg, #eef4ff 0%, #fff0f6 100%);
    }
    .eyebrow { font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--blue); font-weight: 800; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .action-card { min-height: 110px; flex-direction: column; align-items: flex-start; justify-content: space-between; text-align: left; }
    .action-card small { color: var(--muted); font-size: 11px; }
    .emoji-badge {
      width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; font-size: 22px;
    }
    .section { padding: 0 18px; margin-top: 20px; }
    .section-head { margin-bottom: 12px; }
    .section-head h2 { font-size: 16px; font-weight: 800; color: var(--navy); }
    .link-text { color: var(--blue); font-size: 12px; font-weight: 800; }
    .role-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 0 18px; margin-top: 14px; }
    .role-tile {
      border-radius: 22px; padding: 20px 14px; text-align: left; box-shadow: var(--shadow); min-height: 128px;
      display: flex; flex-direction: column; justify-content: space-between;
    }
    .role-tile .ic { font-size: 30px; }
    .role-tile h3 { font-size: 15px; margin-top: 8px; }
    .role-tile p { margin: 3px 0 0; font-size: 10.5px; opacity: 0.85; }

    /* ---------- Events list ---------- */
    .events-header { text-align: center; padding: 16px 50px 4px; }
    .events-header h1 { font-size: 25px; font-weight: 800; color: var(--navy); }
    .meta-row { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px 6px; font-size: 12.5px; }
    .event-card {
      display: flex; gap: 0; border-radius: 20px; overflow: hidden; background: #fff; border: 1px solid var(--line);
      box-shadow: 0 8px 20px rgba(30,40,100,0.06); text-align: left; width: 100%;
    }
    .event-cover {
      width: 104px; flex-shrink: 0; display: flex; align-items: flex-end; padding: 10px; font-size: 30px;
      color: #fff; position: relative;
    }
    .event-cover span.cover-emoji { font-size: 30px; }
    .event-body { flex: 1; padding: 12px 14px; min-width: 0; }
    .event-name { font-size: 15px; font-weight: 800; color: var(--navy); }
    .event-meta { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--muted); margin-top: 4px; }
    .stat-row { display: flex; gap: 0; margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line); }
    .stat-col { flex: 1; }
    .stat-col .lbl { font-size: 9.5px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; }
    .stat-col .val { font-size: 12.5px; font-weight: 800; margin-top: 2px; }
    .code-chip { display: inline-flex; align-items: center; gap: 6px; background: #eef1fb; color: var(--navy-2); font-weight: 800; font-size: 11.5px; padding: 6px 12px; border-radius: 999px; letter-spacing: 0.03em; }

    /* ---------- Hub cards (Create/Open, Send/Receive) ---------- */
    .hub-banner {
      position: relative; margin: 4px 0 18px; border-radius: 22px; padding: 26px 18px; text-align: center; font-size: 40px;
      background: linear-gradient(135deg, #eef4ff 0%, #fdeef9 55%, #fff6e8 100%); box-shadow: var(--shadow); overflow: hidden;
      letter-spacing: 6px;
    }
    .hub-banner::before, .hub-banner::after {
      content: '✨'; position: absolute; font-size: 16px; opacity: 0.6;
    }
    .hub-banner::before { top: 12px; left: 18px; }
    .hub-banner::after { bottom: 12px; right: 18px; }
    .hub-card {
      position: relative; display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; border-radius: 22px;
      padding: 18px; border: 1px solid rgba(0,0,0,0.04); box-shadow: var(--shadow); margin-bottom: 16px; overflow: hidden;
    }
    .hub-card::before {
      content: ''; position: absolute; top: 0; right: 0; width: 0; height: 0;
      border-style: solid; border-width: 0 30px 30px 0; border-color: transparent var(--gold) transparent transparent; opacity: 0.9;
    }
    .hub-icon {
      width: 58px; height: 58px; border-radius: 50%; display: grid; place-items: center; font-size: 26px; flex-shrink: 0;
      border: 2px solid rgba(255,255,255,0.7); box-shadow: inset 0 0 0 1px rgba(0,0,0,0.03);
    }
    .hub-card .arrow-circle {
      width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-size: 18px; flex-shrink: 0;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
    }
    .hub-card h3 { font-size: 16.5px; font-weight: 800; }
    .hub-card .flourish { width: 44px; height: 2px; margin: 6px 0; background: linear-gradient(90deg, var(--gold-2), transparent); }
    .hub-card p { margin: 3px 0 0; font-size: 12px; color: var(--muted); }

    /* ---------- Type grid ---------- */
    .type-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 12px; }
    .type-tile {
      border: 1px solid var(--line); border-radius: 16px; padding: 14px 6px; text-align: center; background: #fff;
      display: grid; place-items: center; gap: 6px; font-size: 11.5px; font-weight: 700; color: var(--text);
      position: relative;
    }
    .type-tile.active { border-color: var(--blue); box-shadow: 0 0 0 2px rgba(47,107,239,0.15); color: var(--blue); }
    .type-tile .ti { font-size: 22px; }
    .more-panel { margin-top: 14px; border-radius: 18px; padding: 14px; background: #f4f6fd; }
    .more-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
    .more-tile { display: flex; align-items: center; gap: 10px; background: #fff; border-radius: 14px; padding: 10px 12px; font-size: 12px; font-weight: 700; text-align: left; }

    /* ---------- Create Event (per-type) ---------- */
    .create-progress { display: flex; gap: 6px; margin: 12px 0 4px; }
    .create-progress .seg { flex: 1; height: 5px; border-radius: 4px; background: #e7ebfa; }
    .step-badge { display: flex; align-items: center; gap: 8px; margin: 10px 0 4px; }
    .step-badge .num { width: 22px; height: 22px; border-radius: 50%; background: var(--blue); color: #fff; font-size: 11px; font-weight: 800; display: grid; place-items: center; }
    .step-badge .lbl { font-size: 12.5px; font-weight: 800; color: var(--blue); }
    .cover-empty { display: grid; grid-template-columns: 108px 1fr; gap: 14px; padding: 16px; text-align: left; }
    .cover-empty .img-box {
      border: 2px dashed var(--line); border-radius: 16px; height: 108px; display: grid; place-items: center;
      text-align: center; font-size: 11px; font-weight: 700; color: var(--muted); gap: 4px; padding: 8px; position: relative;
    }
    .cover-empty .img-box .cam { font-size: 26px; }
    .cover-empty .img-box .plus-badge {
      position: absolute; bottom: 6px; right: 6px; width: 20px; height: 20px; border-radius: 50%;
      background: var(--blue); color: #fff; font-size: 12px; display: grid; place-items: center;
    }
    .cover-empty .quote { grid-column: 1 / -1; margin-top: 8px; text-align: center; font-size: 12px; font-style: italic; font-weight: 700; }
    .cover-filled { position: relative; border-radius: 16px; overflow: hidden; height: 150px; }
    .cover-filled img, .cover-filled .ph { width: 100%; height: 100%; object-fit: cover; display: block; }
    .cover-filled .ph { display: grid; place-items: center; font-size: 40px; }
    .cover-filled .edit-fab {
      position: absolute; bottom: 8px; right: 8px; width: 34px; height: 34px; border-radius: 50%;
      background: #fff; box-shadow: var(--shadow); display: grid; place-items: center; font-size: 14px;
    }
    .detail-section { border-radius: 18px; padding: 14px; margin-top: 14px; background: #fff; box-shadow: var(--shadow); }
    .detail-section .sec-head { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 13.5px; margin-bottom: 10px; }
    .person-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .person-col { border-radius: 14px; padding: 10px; }
    .person-col .p-head { display: flex; align-items: center; gap: 6px; font-weight: 800; font-size: 12px; margin-bottom: 8px; }
    .person-col .field { margin-bottom: 8px; }
    .person-col .field label { font-size: 10.5px; }
    .info-banner { display: flex; gap: 8px; align-items: flex-start; border-radius: 14px; padding: 10px 12px; font-size: 11.5px; font-weight: 600; margin-top: 10px; }
    .org-tile-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
    .org-tile {
      border: 1px solid var(--line); border-radius: 14px; padding: 10px 4px; text-align: center; background: #fff;
      font-size: 10.5px; font-weight: 700; display: grid; place-items: center; gap: 4px; position: relative;
    }
    .org-tile.active { border-color: var(--blue); box-shadow: 0 0 0 2px rgba(47,107,239,0.15); color: var(--blue); }
    .add-address-link { background: none; border: none; padding: 0; margin-top: 6px; font-size: 12px; font-weight: 800; color: var(--pink-2); }
    .save-draft-btn { margin-top: 10px; background: #fff; border: 1.5px solid #ffd7e2; color: var(--pink-2); font-weight: 800; }
    .collection-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
    .collection-tile {
      border-radius: 18px; padding: 16px 10px; text-align: center; box-shadow: var(--shadow);
      display: grid; place-items: center; gap: 6px; font-weight: 800; font-size: 12.5px; color: var(--text);
      border: 2px solid transparent;
    }
    .collection-tile.active { border-color: var(--blue); }
    .collection-tile .ci { font-size: 28px; }

    /* ---------- Records ---------- */
    .summary-card {
      margin: 14px 18px 0; border-radius: 22px; padding: 18px; background: linear-gradient(135deg,#eef2ff 0%,#f5eeff 100%);
      box-shadow: var(--shadow);
    }
    .summary-title { font-size: 13.5px; font-weight: 800; color: var(--navy); margin-bottom: 12px; }
    .summary-split { display: flex; align-items: center; }
    .summary-item { flex: 1; display: flex; align-items: center; gap: 10px; }
    .summary-icon { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; font-size: 18px; flex-shrink: 0; }
    .summary-divider { width: 1px; height: 34px; background: var(--line); margin: 0 6px; }
    .summary-item .lbl { font-size: 11px; color: var(--muted); font-weight: 700; }
    .summary-item .val { font-size: 17px; font-weight: 800; margin-top: 1px; }
    .yet-row { margin-top: 12px; padding-top: 12px; border-top: 1px solid rgba(30,40,100,0.08); }
    .yet-row .lbl { font-size: 11px; color: var(--muted); font-weight: 700; }
    .yet-row .val { font-size: 18px; font-weight: 800; color: var(--blue); margin-top: 2px; }
    .filter-row { display: flex; gap: 8px; overflow-x: auto; padding: 4px 0; scrollbar-width: none; }
    .filter-row::-webkit-scrollbar { display: none; }
    .filter-chip {
      flex-shrink: 0; display: flex; align-items: center; gap: 6px; background: #fff; border: 1px solid var(--line);
      border-radius: 999px; padding: 9px 14px; font-size: 11.5px; font-weight: 800; color: var(--text);
    }
    .filter-chip.active { background: var(--blue); border-color: var(--blue); color: #fff; }
    .search-row { display: flex; gap: 8px; margin-top: 10px; }
    .search-row input { flex: 1; }
    .detail-filter-btn { flex-shrink: 0; display: flex; align-items: center; gap: 6px; padding: 0 14px; border: 1px solid #dbe6ff; border-radius: 14px; color: var(--blue); font-weight: 800; font-size: 11.5px; background: #fff; position: relative; }
    .filter-badge { position: absolute; top: -6px; right: -6px; background: var(--pink-2); color: #fff; font-size: 9px; width: 16px; height: 16px; border-radius: 50%; display: grid; place-items: center; }
    .record-row { display: flex; align-items: center; gap: 12px; background: #fff; border: 1px solid var(--line); border-radius: 18px; padding: 13px; margin-bottom: 10px; }
    .record-icon { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; font-size: 20px; flex-shrink: 0; }
    .record-mid { flex: 1; min-width: 0; }
    .record-mid .t { font-size: 13.5px; font-weight: 800; }
    .record-mid .m { display: flex; gap: 8px; font-size: 11px; color: var(--muted); margin-top: 3px; flex-wrap: wrap; }
    .record-side { text-align: right; flex-shrink: 0; }
    .record-side .amt { font-size: 14px; font-weight: 800; }
    .status-chip { display: inline-flex; align-items: center; gap: 3px; font-size: 10px; font-weight: 800; padding: 4px 9px; border-radius: 999px; margin-top: 5px; }
    .status-chip.Pending { background: var(--pending-bg); color: var(--pending); }
    .status-chip.Complete { background: var(--success-bg); color: var(--success); }
    .status-chip.Old { background: var(--old-bg); color: var(--old); }

    }
    function typeMeta(t) { return eventTypeMeta[t] || eventTypeMeta.default; }
    function collMeta(t) { return collectionTypeMeta[t] || collectionTypeMeta.default; }
    function statusLabel(s) { return s === 'Old' ? 'Partially Completed' : s; }

    function recordsToRows(ev) {
      const header = ['Title', 'Person', 'Place', 'Old Amount', 'New Amount', 'Amount', 'Mode', 'Status', 'Date'];
      const rows = ev.records.map(r => [r.title, r.person, r.place, r.oldAmount || 0, r.newAmount || 0, r.amount, r.mode, statusLabel(r.status), r.date]);
      return [header, ...rows];
    }
    function downloadRecordsExcel() {
      const ev = getActiveEvent();
      if (!ev.records.length) { showToast('No records to export yet'); return; }
      const rows = recordsToRows(ev);
      const csv = rows.map(row => row.map(cell => `"${String(cell).replace(/"/g, '""')}"`).join(',')).join('\r\n');
      const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${ev.name.replace(/[^a-z0-9]+/gi, '-')}-records.csv`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      showToast('Excel (CSV) file downloaded');
    }
    function downloadRecordsPdf() {
      const ev = getActiveEvent();
      if (!ev.records.length) { showToast('No records to export yet'); return; }
      const rows = recordsToRows(ev);
      const win = window.open('', '_blank');
      if (!win) { showToast('Please allow pop-ups to export as PDF'); return; }
      win.document.write(`
        <html><head><title>${ev.name} - Records</title>
        <style>
          body { font-family: Arial, sans-serif; padding: 24px; color: #1c1f3a; }
          h1 { font-size: 18px; margin-bottom: 2px; }
          p { color: #6b7093; font-size: 12px; }
          table { width: 100%; border-collapse: collapse; margin-top: 14px; }
          th, td { border: 1px solid #ddd; padding: 6px 8px; font-size: 11px; text-align: left; }
          th { background: #f4f6fd; }
        </style></head>
        <body>
          <h1>${ev.name} — Gift Records</h1>
          <p>Exported ${new Date().toLocaleString('en-GB')}</p>
          <table>
            <thead><tr>${rows[0].map(h => `<th>${h}</th>`).join('')}</tr></thead>
            <tbody>${rows.slice(1).map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</tbody>
          </table>
          <script>window.onload = () => setTimeout(() => window.print(), 200);<\/script>
        </body></html>
      `);
      win.document.close();
      win.focus();
    }
    function qrBoxHTML(ev, canvasId) {
      if (ev.qrImage) return `<div class="qr-box"><img src="${ev.qrImage}"></div>`;
      return `<div class="qr-box"><canvas id="${canvasId}" width="150" height="150"></canvas></div>`;
    }
    function drawEventQr(canvasId, ev, amount) {
      if (ev.qrImage) return;
      const canvas = document.getElementById(canvasId);
      if (!canvas || typeof QRCode === 'undefined' || !ev.upi) return;
      const params = new URLSearchParams({ pa: ev.upi, pn: ev.host || 'Relfam', cu: 'INR' });
      if (amount) params.set('am', String(amount));
      const uri = `upi://pay?${params.toString()}`;
      QRCode.toCanvas(canvas, uri, { width: 150, margin: 1 }, () => {});
    }

    /* ---------- Derived ledger totals (source of truth = records, never stored separately) ---------- */
    function eventTotals(ev) {
      const received = ev.records.filter(r => r.direction === 'received').reduce((s, r) => s + r.amount, 0);
      const given = ev.records.filter(r => r.direction === 'given').reduce((s, r) => s + r.amount, 0);
      const completed = ev.targetAmount || 0;
      const pending = Math.max(completed - received, 0);
      return { received, given, collected: received, pending, completed };
    }
    function collectionTotals(col) {
      const sent = col.entries.reduce((s, e) => s + e.amount, 0);
      const pending = col.entries.filter(e => e.status === 'Pending').reduce((s, e) => s + e.amount, 0);
      const completed = col.entries.filter(e => e.status === 'Complete').reduce((s, e) => s + e.amount, 0);
      return { sent, pending, completed };
    }

    // Opens a native app via its custom URL scheme; if the app isn't

    function openAppOrStore(schemeUrl, storeUrl) {
      const start = Date.now();
      window.location.href = schemeUrl;
      setTimeout(() => {

          window.location.href = storeUrl;
        }

    function toggleFullAddress() {
      state.newEventDraft.showFullAddress = !state.newEventDraft.showFullAddress;
      render();
    }
    function computeTurningAge(dob, eventDateIso) {
      if (!dob) return '';
      const birth = new Date(dob);
      if (isNaN(birth)) return '';
      const ref = eventDateIso ? new Date(eventDateIso) : new Date();
      let age = ref.getFullYear() - birth.getFullYear();
      const m = ref.getMonth() - birth.getMonth();
      if (m < 0 || (m === 0 && ref.getDate() < birth.getDate())) age--;
      return age >= 0 ? age : '';
    }
    function onTypeFieldInput(key, value) {
      state.newEventDraft.typeFields[key] = value;
    }
    function onTypeFieldInputRerender(key, value) {
      state.newEventDraft.typeFields[key] = value;
      render();
    }
    function saveEventDraft() {
      localStorage.setItem('eventxSavedDraft', JSON.stringify({ selectedType: state.selectedType, draft: state.newEventDraft, payMode: state.newEventPayMode }));
      showToast('Draft saved — resume anytime from Create New Event');
    }
    function setNewEventPayMode(mode) {
      state.newEventPayMode = mode;
      render();

    function onQrFileChange(evt) {
      const file = evt.target.files[0];

      const reader = new FileReader();
      reader.onload = () => { state.newEventDraft.qrImage = reader.result; render(); };
      reader.readAsDataURL(file);
    }
    function todayIso() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }
    function isValidUpi(v) {
      return /^[a-zA-Z0-9.\-_]{2,256}@[a-zA-Z]{2,64}$/.test((v || '').trim());
    }
    function easyTimePickerHTML(current) {
      const m = /^(\d{1,2}):(\d{2})\s*(AM|PM)$/i.exec((current || '').trim());
      const hour = m ? String(Number(m[1])) : '';
      const min = m ? m[2] : '';
      const ampm = m ? m[3].toUpperCase() : '';
      return `
        <div class="grid-2" style="grid-template-columns:1fr 1fr 1fr;gap:8px;">
          <select id="evTimeHour" onchange="updateEasyTime()">
            <option value="">Hour</option>
            ${Array.from({ length: 12 }, (_, i) => i + 1).map(h => `<option value="${h}" ${String(h) === hour ? 'selected' : ''}>${h}</option>`).join('')}
          </select>
          <select id="evTimeMin" onchange="updateEasyTime()">
            <option value="">Min</option>
            ${['00', '15', '30', '45'].map(mm => `<option value="${mm}" ${mm === min ? 'selected' : ''}>${mm}</option>`).join('')}
          </select>
          <select id="evTimeAmPm" onchange="updateEasyTime()">
            <option value="">AM/PM</option>
            <option ${ampm === 'AM' ? 'selected' : ''}>AM</option>
            <option ${ampm === 'PM' ? 'selected' : ''}>PM</option>
          </select>
        </div>
      `;
    }
    function updateEasyTime() {
      const h = document.getElementById('evTimeHour').value;
      const m = document.getElementById('evTimeMin').value;
      const ap = document.getElementById('evTimeAmPm').value;
      state.newEventDraft.time = (h && m && ap) ? `${h.padStart(2, '0')}:${m} ${ap}` : '';
    }
    const venueSuggestions = [
      'The Grand Taj, Anna Salai, Chennai', 'ABC Mahal, Anna Nagar, Chennai', 'Le Meridien, Chennai',
      'Maple Banquet, Noida', 'Community Hall, Sector 21, Gurugram', 'Temple Mandapam, Coimbatore',
      'Lotus Banquet Hall, Mumbai', 'Green Park Community Center, New Delhi', 'Rose Garden, Bangalore',
      'Palm Grove Resort, Madurai', 'City Convention Center, Hyderabad', 'Riverside Lawns, Trichy'
    ];

    function createEventFormScreen() {
      state.newEventDraft = state.newEventDraft || { name: '', date: '', time: '', venue: '', upi: '', desc: '', cover: '', qrImage: '', hostName: '', showFullAddress: false, typeFields: {} };
      state.newEventDraft.typeFields = state.newEventDraft.typeFields || {};
      state.newEventPayMode = state.newEventPayMode || 'upi';
      const d = state.newEventDraft;
      const tf = d.typeFields;
      const isEdit = !!state.editingEventId;
      const displayType = state.selectedType === 'More' ? 'Custom Event' : state.selectedType;
      const isMore = isMoreType(displayType);
      const theme = themeFor(displayType);
      const titleText = isEdit ? `Edit ${displayType}` : (isMore ? `Create ${displayType}` : 'Create New Event');

        tailOpts.title = '📅 Event Date & Time';
        tailOpts.showName = false;
      }
      if (isMore) {
        tailOpts.venueLabel = displayType === 'Religious Event' ? 'Place / Address' : (displayType === 'Custom Event' ? 'Venue / Location' : 'Venue');

        tailOpts.showAddFullAddress = true;
        tailOpts.upiLabel = displayType === 'Custom Event' ? 'UPI ID for Payments / Contributions *' : 'UPI ID for Gift Collection *';
        tailOpts.upiNote = displayType === 'Custom Event' ? 'Your UPI ID is safe and will be used only for payment collection.' : 'Your UPI ID is safe and will be used only for gift collection.';
        if (displayType === 'Custom Event') {
          tailOpts.extraTopFields = `<div class="field"><label>Event Type / Category (Optional)</label><select onchange="onTypeFieldInput('customCategory', this.value)"><option value="">Select category</option>${['Get Together', 'Celebration', 'Meet-up', 'Festival', 'Reunion', 'Other'].map(c => `<option ${tf.customCategory === c ? 'selected' : ''}>${c}</option>`).join('')}</select></div>`;
        }
        if (displayType === 'Religious Event') {
          tailOpts.extraTopFields = `

            <div class="field"><label>Department / Section (Optional)</label><input value="${tf.deptSection || ''}" placeholder="e.g. Computer Science Department" oninput="onTypeFieldInput('deptSection', this.value)"></div>
          `;
        }

      return wrapForm(`

            <button class="icon-btn" onclick="showInfoModal('Event Details', 'Fill in your event details below. Slide the bar at the bottom to finish${isMore ? ', or tap Save Draft to continue later' : ''}.')">?</button>
          </div>
          ${isMore ? `<div class="step-badge"><span class="num">1</span><span class="lbl">Event Details</span></div>` : `
            <div class="create-progress">
              <div class="seg" style="background:${theme.color};"></div><div class="seg"></div><div class="seg"></div>

          ${coverSectionHTML(d, displayType, theme, isMore)}
          ${typeDetailsSectionHTML(displayType, d)}

          <div style="margin-top:20px;">

              <div class="slide-handle" id="slideHandle" style="color:${theme.color};">→</div>

    function onCoverFileChange(evt) {
      const file = evt.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => { state.newEventDraft.cover = reader.result; render(); };
      reader.readAsDataURL(file);
    }
    function onVenueInput(val) {
      state.newEventDraft.venue = val;
      const box = document.getElementById('venueSuggestions');
      const q = val.trim().toLowerCase();
      if (!q) { box.style.display = 'none'; box.innerHTML = ''; return; }
      const matches = venueSuggestions.filter(v => v.toLowerCase().includes(q)).slice(0, 5);
      if (!matches.length) { box.style.display = 'none'; box.innerHTML = ''; return; }
      box.style.display = 'block';
      box.innerHTML = matches.map(m => `<div class="suggestion-item" onclick="pickVenueSuggestion('${m.replace(/'/g, "\\'")}')">📍 ${m}</div>`).join('');
    }
    function pickVenueSuggestion(v) {
      state.newEventDraft.venue = v;
      document.getElementById('evVenue').value = v;
      const box = document.getElementById('venueSuggestions');
      box.style.display = 'none';
      box.innerHTML = '';
    }
    function useCurrentLocation() {
      if (!navigator.geolocation) { showToast('Location access is not available on this device'); return; }
      showToast('Getting your location...');
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const val = `Current Location (${pos.coords.latitude.toFixed(4)}, ${pos.coords.longitude.toFixed(4)})`;
          state.newEventDraft.venue = val;
          document.getElementById('evVenue').value = val;
          showToast('Location set');
        },
        () => showToast('Could not access your location — check permissions'),
        { timeout: 8000 }
      );

    function initSlideConfirm() {
      const track = document.getElementById('slideTrack');
      const handle = document.getElementById('slideHandle');
      const fill = document.getElementById('slideFill');
      if (!track || !handle || !fill) return;
      let dragging = false, startX = 0, baseX = 0, currentX = 0;
      const maxX = () => track.clientWidth - handle.offsetWidth - 6;
      function setX(x) {
        currentX = Math.max(0, Math.min(maxX(), x));
        handle.style.transform = `translateX(${currentX}px)`;
        fill.style.width = (currentX + handle.offsetWidth) + 'px';
      }
      function onDown(e) {
        dragging = true;
        startX = (e.touches ? e.touches[0].clientX : e.clientX);
        baseX = currentX;
      }
      function onMove(e) {
        if (!dragging) return;
        const clientX = (e.touches ? e.touches[0].clientX : e.clientX);
        setX(baseX + (clientX - startX));
      }
      function onUp() {
        if (!dragging) return;
        dragging = false;
        if (currentX >= maxX() * 0.82) {
          setX(maxX());
          const ok = createNewEvent();
          if (!ok) setX(0);
        } else {
          setX(0);
        }
      }
      handle.addEventListener('pointerdown', onDown);
      window.addEventListener('pointermove', onMove);
      window.addEventListener('pointerup', onUp);
    }

    function createNewEvent() {
      const d = state.newEventDraft;
      const tf = d.typeFields;
      const isEdit = !!state.editingEventId;
      const displayType = state.selectedType === 'More' ? 'Custom Event' : state.selectedType;
      const isMore = isMoreType(displayType);
      if (!d.date) { showToast('Please select an event date'); return false; }
      if (!isEdit && d.date < todayIso()) { showToast('Event date cannot be in the past'); return false; }
      if (isMore && !d.venue.trim()) { showToast('Please enter a venue'); return false; }
      if (state.newEventPayMode === 'qr') {
        if (!d.qrImage) { showToast('Please upload your UPI QR code image'); return false; }
      } else if (!isValidUpi(d.upi)) {
        showToast('Enter a valid UPI ID (e.g. name@bank)'); return false;
      }
      if ((displayType === 'Wedding' || displayType === 'Engagement' || displayType === 'Reception') && (!(tf.groomName || '').trim() || !(tf.brideName || '').trim())) {
        showToast('Please enter both Groom and Bride names'); return false;
      }
      if (displayType === 'Housewarming' && (!(tf.hostFullName || '').trim() || !(tf.hostPhone || '').trim() || !(tf.hostAddress || '').trim())) {
        showToast('Please fill in the Host Details'); return false;
      }
      if (displayType === 'Birthday' && (!(tf.birthdayPerson || '').trim() || !tf.dob)) {
        showToast('Please fill in the Birthday Details'); return false;
      }
      if (displayType === 'Baby Shower' && !(tf.honoreeName || '').trim()) {
        showToast('Please enter the Honoree (Mom-to-be) Name'); return false;
      }
      if (displayType === 'Puberty Ceremony' && (!(tf.celebrantName || '').trim() || !(tf.fatherName || '').trim() || !(tf.motherName || '').trim())) {
        showToast('Please fill in the celebrant and parent/guardian details'); return false;
      }
      if (displayType === 'Religious Event' && (!(tf.religiousPlaceType || '').trim() || !(tf.placeName || '').trim())) {
        showToast('Please fill in the religious place details'); return false;
      }
      if (displayType === 'Corporate Event' && (!(tf.orgType || '').trim() || !(tf.orgName || '').trim())) {
        showToast('Please fill in the organization details'); return false;
      }

      const autoName = () => {
        if (displayType === 'Wedding' || displayType === 'Engagement' || displayType === 'Reception') {
          const both = [tf.groomName, tf.brideName].filter(Boolean).join(' & ');
          return both ? `${both} ${displayType}` : `${getUserName()}'s ${displayType}`;
        }
        if (displayType === 'Birthday') return tf.birthdayPerson ? `${tf.birthdayPerson}'s Birthday` : `${getUserName()}'s Birthday`;
        if (displayType === 'Housewarming') return tf.hostFullName ? `${tf.hostFullName} Housewarming` : `${getUserName()}'s Housewarming`;
        return `${getUserName()}'s ${displayType}`;
      };
      const autoHost = () => {
        if (displayType === 'Wedding' || displayType === 'Engagement' || displayType === 'Reception') {
          return [tf.groomName, tf.brideName].filter(Boolean).join(' & ') || getUserName();
        }
        if (displayType === 'Housewarming') return tf.hostFullName || getUserName();
        if (displayType === 'Corporate Event') return tf.orgName || getUserName();
        return getUserName();
      };

      const name = d.name.trim() || autoName();
      const host = autoHost();
      const upi = state.newEventPayMode === 'qr' ? '' : d.upi.trim();
      const qrImage = state.newEventPayMode === 'qr' ? d.qrImage : '';
      const date = new Date(d.date).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
      const time = d.time || 'Time TBD';
      const venue = d.venue.trim();
      const typeFields = Object.assign({}, tf);

      if (isEdit) {
        const ev = state.events.find(e => e.id === state.editingEventId);
        Object.assign(ev, { name, type: displayType, upi, qrImage, description: d.desc, cover: d.cover, date, time, venue, host, typeFields });
        persist();
        resetNewEventDraft();
        state.editingEventId = null;

        nav('event-detail');
        return true;

        id: state.nextEventId++,

        description: d.desc, cover: d.cover, date, time, venue, typeFields,
        host, trustScore: 85, familyVerified: 1, targetAmount: 0, records: []
      };
      state.events.unshift(ev);
      persist();
      resetNewEventDraft();
      state.selectedType = 'Wedding';
      state.showMore = false;
      state.activeEventId = ev.id;
      nav('event-created-success');
      return true;
    }

    function wrapCanvasText(ctx, text, x, y, maxWidth, lineHeight) {
      const words = text.split(' ');
      let line = '';
      let lines = [];
      for (const word of words) {
        const test = line ? `${line} ${word}` : word;
        if (ctx.measureText(test).width > maxWidth && line) {
          lines.push(line);
          line = word;
        } else {
          line = test;
        }
      }
      if (line) lines.push(line);
      lines.forEach((l, i) => ctx.fillText(l, x, y + i * lineHeight));
      return lines.length;
    }

    function shareInvitationAsImage() {
      const ev = getActiveEvent();
      const copy = invitationCopy(ev);
      const canvas = document.createElement('canvas');
      canvas.width = 800;
      canvas.height = 1000;
      const ctx = canvas.getContext('2d');

      const grad = ctx.createLinearGradient(0, 0, 800, 1000);
      grad.addColorStop(0, '#fdf2f0');
      grad.addColorStop(1, '#fff8f4');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 800, 1000);
      ctx.strokeStyle = '#f3ddd6';
      ctx.lineWidth = 6;
      ctx.strokeRect(20, 20, 760, 960);

      ctx.textAlign = 'center';
      ctx.fillStyle = '#6b7093';
      ctx.font = '600 20px Arial, sans-serif';
      ctx.fillText(copy.eyebrow, 400, 140);

      ctx.fillStyle = '#7a2b3a';
      ctx.font = 'bold 52px Georgia, serif';
      const headingLines = wrapCanvasText(ctx, copy.heading, 400, 230, 680, 62);

      ctx.fillStyle = '#4a4a55';
      ctx.font = '24px Arial, sans-serif';
      const subtitleY = 230 + headingLines * 62 + 40;
      copy.subtitle.replace(/<br\s*\/?>/g, '\n').split('\n').forEach((line, i) => ctx.fillText(line, 400, subtitleY + i * 34));

      ctx.textAlign = 'left';
      ctx.font = '26px Arial, sans-serif';
      ctx.fillStyle = '#1c1f3a';
      const detailsY = subtitleY + 100;
      [`📅 ${ev.date}`, `🕐 ${ev.time} Onwards`, `📍 ${ev.venue}`].forEach((line, i) => ctx.fillText(line, 100, detailsY + i * 50));

      ctx.textAlign = 'center';
      ctx.font = '22px Arial, sans-serif';
      ctx.fillStyle = '#7a2b3a';
      ctx.fillText(copy.closing, 400, 920);

      canvas.toBlob((blob) => {
        if (!blob) { showToast('Could not generate invitation image'); return; }
        const file = new File([blob], `${ev.name.replace(/[^a-z0-9]+/gi, '-')}-invitation.png`, { type: 'image/png' });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          navigator.share({ files: [file], title: ev.name, text: `You're invited to ${ev.name}! Event code: ${ev.code}` }).catch(() => {});
        } else {
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = file.name;
          document.body.appendChild(a);
          a.click();
          a.remove();
          URL.revokeObjectURL(url);
          showToast('Image saved — opening WhatsApp so you can attach it');
          setTimeout(() => shareEvent(ev.id), 900);
        }
      }, 'image/png');
    }

    function onEntryTypeChange() {
      const isOld = document.getElementById('enOld').checked;
      const isNew = document.getElementById('enNew').checked;
      state.enDraft.old = isOld;
      state.enDraft.new = isNew;
      document.getElementById('oldTypeCard').style.opacity = isOld ? '1' : '0.55';
      document.getElementById('newTypeCard').style.opacity = isNew ? '1' : '0.55';
      const oldAmtInput = document.getElementById('enOldAmt');
      const newAmtInput = document.getElementById('enNewAmt');
      oldAmtInput.disabled = !isOld;
      newAmtInput.disabled = !isNew;
      if (!isOld) { oldAmtInput.value = ''; state.enDraft.oldAmt = ''; }
      if (!isNew) { newAmtInput.value = ''; state.enDraft.newAmt = ''; }
      updateEntryTotal();
    }
    function startVoiceInput(targetId) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) { showToast('Voice input is not supported on this device'); return; }
      const recognition = new SpeechRecognition();
      recognition.lang = 'en-IN';
      recognition.interimResults = false;
      recognition.maxAlternatives = 1;
      showToast('Listening...');
      recognition.onresult = (e) => {
        const text = e.results[0][0].transcript;
        const el = document.getElementById(targetId);
        el.value = text;
        el.dispatchEvent(new Event('input', { bubbles: true }));
        showToast('Captured: ' + text);
      };
      recognition.onerror = () => showToast('Could not capture voice input');
      recognition.start();
    }
    function updateEntryTotal() {
      const oldAmt = Number(document.getElementById('enOldAmt').value) || 0;
      const newAmt = Number(document.getElementById('enNewAmt').value) || 0;
      document.getElementById('enTotalDisplay').textContent = money(oldAmt + newAmt);
    }
    function selectPaymentMethod(mode) {
      state.entryMode = mode;
      document.getElementById('payCash').classList.toggle('active', mode === 'Cash');
      document.getElementById('payUpi').classList.toggle('active', mode === 'UPI');
      document.getElementById('qrBlock').style.display = mode === 'UPI' ? 'block' : 'none';
      const btn = document.getElementById('saveEntryBtn');
      btn.style.background = mode === 'UPI'
        ? 'linear-gradient(135deg,var(--blue-2) 0%,var(--blue) 100%)'
        : 'linear-gradient(135deg,var(--pink-2) 0%,var(--pink) 100%)';
    }

    function saveEntry() {
      const isEvent = state.entryContext.kind === 'event';
      const d = state.enDraft;
      if (!d.old && !d.new) { showToast('Select Old and/or New — at least one is required'); return; }
      const oldAmount = d.old ? (Number(d.oldAmt) || 0) : 0;
      const newAmount = d.new ? (Number(d.newAmt) || 0) : 0;
      if (oldAmount + newAmount <= 0) { showToast('Enter an amount for the selected entry type(s)'); return; }

      const person = d.person || 'Someone special';
      const mobile = d.mobile ? `${d.code} ${d.mobile}` : '';
      const place = d.place || '—';
      const title = d.title || (isEvent ? 'Moi Entry' : 'Gift Sent');
      const baseDate = new Date().toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
      const direction = isEvent ? 'received' : 'given';
      const icon = isEvent ? '💝' : '🎁';
      const receiverUpi = isEvent ? undefined : (d.receiverUpi || '');

      // Old and New are recorded as two separate, independently-editable entries
      // when both are filled in, rather than one combined record.
      const newRecords = [];
      if (oldAmount > 0) {
        newRecords.push({
          id: state.nextRecordId++, title, person, mobile, place,
          oldAmount, newAmount: 0, amount: oldAmount,
          mode: state.entryMode, status: 'Old', date: baseDate, direction, icon, receiverUpi
        });
      }
      if (newAmount > 0) {
        newRecords.push({
          id: state.nextRecordId++, title, person, mobile, place,
          oldAmount: 0, newAmount, amount: newAmount,
          mode: state.entryMode, status: 'Pending', date: baseDate, direction, icon, receiverUpi
        });
      }

      if (isEvent) {
        const ev = state.events.find(e => e.id === state.entryContext.id);
        ev.records.unshift(...newRecords);
        persist();
        state.activeEventId = ev.id;
      } else {
        const col = state.collections.find(c => c.id === state.entryContext.id);
        col.entries.unshift(...newRecords);
        persist();
        state.activeCollectionId = col.id;
      }
      const subtitle = newRecords.length > 1 ? 'Recorded as two separate entries — one Old, one New.' : 'Thanks for the contribution.';
      showSuccessModal('Entry Saved Successfully!', subtitle, isEvent ? 'records' : 'collection-detail');
    }

    /* ---------- Records (event ledger) ---------- */
    function amountBucketMatch(bucket, amt) {
      if (bucket === 'all') return true;
      if (bucket === 'lt100') return amt < 100;
      if (bucket === '100-500') return amt >= 100 && amt <= 500;
      if (bucket === '500-1000') return amt > 500 && amt <= 1000;
      if (bucket === '1000-5000') return amt > 1000 && amt <= 5000;
      if (bucket === 'gt5000') return amt > 5000;
      return true;
    }
    function visitCountOf(records, person) {
      return records.filter(r => r.person === person).length;
    }
    function visitBucketMatch(bucket, count) {
      if (bucket === '1') return count === 1;
      if (bucket === '2') return count === 2;
      if (bucket === '3-5') return count >= 3 && count <= 5;
      if (bucket === '6-10') return count >= 6 && count <= 10;
      if (bucket === 'gt10') return count > 10;
      return true;
    }

    function periodMatch(period, dateStr) {
      if (period === 'all') return true;
      const d = new Date(dateStr);
      if (isNaN(d)) return true;
      const days = (Date.now() - d.getTime()) / 86400000;
      if (period === '7d') return days <= 7;
      if (period === '30d') return days <= 30;
      return true;
    }

    function filteredRecords(ev) {
      let list = ev.records;
      if (state.recordsFilter !== 'all') {
        list = list.filter(r => r.status.toLowerCase() === state.recordsFilter);
      }
      const q = state.recordsSearch.trim().toLowerCase();
      if (q) list = list.filter(r => r.person.toLowerCase().includes(q) || r.place.toLowerCase().includes(q));
      const f = state.detailedFilter;
      if (f.places.length) list = list.filter(r => f.places.includes(r.place));
      if (f.statuses.length) list = list.filter(r => f.statuses.includes(r.status));
      if (f.amountBucket === 'custom') {
        const from = Number(f.customFrom) || 0;
        const to = Number(f.customTo) || Infinity;
        list = list.filter(r => r.amount >= from && r.amount <= to);
      } else {
        list = list.filter(r => amountBucketMatch(f.amountBucket, r.amount));
      }
      if (f.visits.length) list = list.filter(r => f.visits.some(v => visitBucketMatch(v, visitCountOf(ev.records, r.person))));
      list = list.filter(r => periodMatch(f.period, r.date));
      return list;
    }

    function activeFilterCount() {
      const f = state.detailedFilter;
      let n = 0;
      if (f.places.length) n += f.places.length;
      if (f.statuses.length) n += f.statuses.length;
      if (f.amountBucket !== 'all') n += 1;
      if (f.period !== 'all') n += 1;
      return n;
    }

        ? state.events.find(e => e.id === containerId).records
        : state.collections.find(c => c.id === containerId).entries;
    }
    function startEditRecord(kind, containerId, recordId) {
      state.editContext = { kind, containerId, recordId };
      nav('edit-record');
    }

    function pickEditStatus(status, labelEl) {

    function saveRecordEdit() {
      const { kind, containerId, recordId, newStatus } = state.editContext;
      const list = recordContainer(kind, containerId);
      const r = list.find(x => x.id === recordId);
      const nameChanged = document.getElementById('erName').value && document.getElementById('erName').value !== r.person;
      const placeChanged = document.getElementById('erPlace').value && document.getElementById('erPlace').value !== r.place;
      const statusChanged = newStatus && newStatus !== r.status;
      r.person = document.getElementById('erName').value || r.person;
      r.place = document.getElementById('erPlace').value || r.place;
      if (newStatus) r.status = newStatus;
      const notes = [];
      if (statusChanged) notes.push(`Marked as ${statusLabel(newStatus).toLowerCase()} manually`);
      if (nameChanged || placeChanged) notes.push('Name/Place edited manually');
      if (notes.length) {
        r.editNote = notes.join(' · ');
        r.editedAt = new Date().toLocaleString('en-GB', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
      }
      persist();
      showToast('Record updated!');
      nav(kind === 'event' ? 'records' : 'collection-detail');
    }

            <div style="display:flex;gap:4px;margin-top:6px;" id="pwdStrengthBar">
              ${[0, 1, 2, 3, 4].map(i => `<span style="flex:1;height:5px;border-radius:99px;background:var(--line);" data-bar="${i}"></span>`).join('')}
            </div>
          </div>
          <div class="field" style="margin-bottom:0;"><label>Confirm New Password</label><div class="field-icon">🔒<input id="cpConfirm" type="password" placeholder="Confirm your new password" value="${state.cpDraft.confirm}" oninput="state.cpDraft.confirm=this.value;"><button class="icon-btn" style="width:28px;height:28px;box-shadow:none;font-size:13px;" onclick="togglePwd('cpConfirm', this)">👁️</button></div></div>
        </div>

          </div>
        </div>
        <button class="primary" style="margin-top:18px;" onclick="changePassword()">Update Password</button>
      `);

    function updatePwdStrength() {
      const val = state.cpDraft.next;
      const passed = pwdRules.filter(([, , test]) => test(val));
      pwdRules.forEach(([key, label]) => {
        const ok = passed.some(p => p[0] === key);
        document.getElementById('rule-' + key).innerHTML = `<span style="font-size:12.5px;color:${ok ? 'var(--success)' : 'var(--muted)'};">${ok ? '✓' : '○'} ${label}</span>`;
      });
      const bars = document.querySelectorAll('#pwdStrengthBar span');
      const labels = ['Weak', 'Weak', 'Fair', 'Good', 'Strong'];
      const colors = ['var(--pending)', 'var(--pending)', '#f2a63d', 'var(--blue)', 'var(--success)'];
      bars.forEach((b, i) => { b.style.background = i < passed.length ? colors[passed.length - 1] : 'var(--line)'; });
      const lbl = document.getElementById('pwdStrengthLabel');
      lbl.textContent = val ? labels[Math.max(passed.length - 1, 0)] : 'Weak';
      lbl.style.color = val ? colors[Math.max(passed.length - 1, 0)] : 'var(--pending)';
    }
    function changePassword() {
      const { current: cur, next, confirm } = state.cpDraft;
      if (!cur) { showToast('Enter your current password'); return; }
      if (!pwdRules.every(([, , test]) => test(next))) { showToast('Password does not meet all requirements'); return; }
      if (next !== confirm) { showToast('Passwords do not match'); return; }
      state.cpDraft = { current: '', next: '', confirm: '' };
      showToast('Password updated successfully');
      nav('profile');
    }

    function transactionHistoryScreen() {
      const all = [];
      state.events.forEach(ev => ev.records.forEach(r => all.push({ ...r, context: ev.name })));
      state.collections.forEach(col => col.entries.forEach(e => all.push({ ...e, context: col.name })));

      all.sort((a, b) => b.id - a.id);
      state.txnFilter = state.txnFilter || 'all';
      const filtered = state.txnFilter === 'all' ? all : all.filter(r => r.direction === state.txnFilter);
      const groups = [];
      filtered.forEach(r => {
        let g = groups.find(g => g.date === r.date);

        g.rows.push(r);
      });
      return wrapPlain(`
